<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="iread">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#d9582b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<title>iread</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{--bg:#faf8f5;--card:#fff;--ink:#1d1b19;--mute:#7a736b;--line:#e8e2da;--acc:#d9582b;--acc2:#fff1ea;--hl:#ffe3a3;--shadow:0 6px 24px rgba(40,25,10,.08)}
@media(prefers-color-scheme:dark){:root{--bg:#141210;--card:#1f1c19;--ink:#f1ece6;--mute:#9b9288;--line:#332f2a;--acc:#ff7a47;--acc2:#2c2019;--hl:#5a4414;--shadow:0 6px 24px rgba(0,0,0,.4)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
button{font-family:inherit}
#app{height:100dvh;max-width:720px;margin:0 auto;position:relative}
.view{display:none;flex-direction:column;height:100%}
.view.on{display:flex}
header{padding:calc(env(safe-area-inset-top) + 12px) 16px 8px;display:flex;align-items:center;gap:8px}
header h1{font-size:22px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.3px}
header h1.small{font-size:16px;text-align:center}
.hb{border:none;background:var(--card);color:var(--ink);border-radius:12px;min-width:40px;height:40px;font-size:16px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.08);padding:0 10px;font-weight:600}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}

/* home */
#libwrap{flex:1;overflow-y:auto;padding:4px 16px 110px}
.book{display:flex;gap:14px;align-items:center;background:var(--card);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow);cursor:pointer}
.cover{width:50px;height:68px;border-radius:8px 12px 12px 8px;background:linear-gradient(135deg,var(--acc),#f2a65a);color:#fff;display:grid;place-items:center;font-weight:700;font-size:20px;flex:none;box-shadow:inset 3px 0 0 rgba(0,0,0,.15)}
.binfo{flex:1;min-width:0}
.bt{font-weight:650;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bs{color:var(--mute);font-size:13px;margin:3px 0 8px}
.bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
.del{border:none;background:none;color:var(--mute);font-size:18px;padding:8px;cursor:pointer}
#fab{position:absolute;right:18px;bottom:calc(env(safe-area-inset-bottom) + 20px);border:none;background:var(--acc);color:#fff;font-size:16px;font-weight:700;padding:15px 22px;border-radius:999px;box-shadow:0 8px 24px rgba(217,88,43,.4);cursor:pointer}
#empty{display:none;flex-direction:column;align-items:center;text-align:center;padding:60px 28px;gap:12px}
#empty .logo{width:96px;height:96px;border-radius:28px;background:var(--acc2);display:grid;place-items:center;font-size:46px}
#empty h2{margin:6px 0 0;font-size:24px}#empty p{margin:0;color:var(--mute);max-width:330px;line-height:1.5;font-size:15px}

/* reader */
#reader{flex:1;overflow-y:auto;padding:8px 24px 28px;font-family:Georgia,"Iowan Old Style",serif;font-size:19px;line-height:1.75}
.s{cursor:pointer;border-radius:5px;padding:1px 0;transition:background .15s}.s.on{background:var(--hl)}
.pgnote{font-family:-apple-system,sans-serif;font-size:14px;color:var(--mute);text-align:center;padding:30px 10px;line-height:1.5}
#player{background:var(--card);border-radius:24px 24px 0 0;padding:14px 18px calc(env(safe-area-inset-bottom) + 14px);box-shadow:0 -8px 30px rgba(40,25,10,.1)}
.row{display:flex;align-items:center;gap:10px}
.prog{display:flex;align-items:center;gap:12px}
.pgbtn{border:none;background:var(--acc2);color:var(--ink);font-weight:650;font-size:13px;padding:9px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
.pbar{flex:1;height:5px;background:var(--line);border-radius:3px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--acc);width:0}
#status{font-size:12px;color:var(--mute);text-align:center;min-height:16px;margin:4px 0}
.ctrls{justify-content:center;gap:14px;margin:2px 0 10px}
.ic{width:46px;height:46px;border-radius:50%;border:none;background:var(--acc2);color:var(--ink);font-size:18px;cursor:pointer}
.ic.play{width:64px;height:64px;background:var(--acc);color:#fff;font-size:25px;box-shadow:0 6px 16px rgba(217,88,43,.35)}
.chips{display:flex;gap:6px;justify-content:center;margin-bottom:10px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:none;color:var(--ink);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;margin-bottom:8px}
.seg button{flex:1;border:none;background:none;color:var(--mute);padding:8px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
select{flex:1;min-width:0;padding:11px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:14px}

/* sheets & toast */
#sheetBg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;align-items:flex-end;justify-content:center}
#sheet{background:var(--card);width:100%;max-width:720px;border-radius:24px 24px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom) + 20px);max-height:75dvh;overflow-y:auto}
#sheet h3{margin:0 0 12px;font-size:18px}
.bm{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.bm .t{flex:1;min-width:0}.bm .t b{font-size:13px;color:var(--acc)}.bm .t div{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 270px);background:var(--ink);color:var(--bg);padding:10px 15px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s;max-width:88%;text-align:center;z-index:30}
#toast.show{opacity:.95}
#load{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);place-items:center;color:#fff;font-weight:600;z-index:40}
</style>
</head>
<body>
<div id="app">

  <!-- LIBRARY -->
  <div class="view on" id="home">
    <header><h1>iread</h1></header>
    <div id="libwrap">
      <div id="empty">
        <div class="logo">🎧</div>
        <h2>Listen to any PDF</h2>
        <p>Books, papers, reports, even scans. Natural voices that run on your phone. Your library and progress are saved here.</p>
      </div>
      <div id="list"></div>
    </div>
    <button id="fab">＋ Add PDF</button>
  </div>

  <!-- READER -->
  <div class="view" id="rd">
    <header>
      <button class="hb" id="back">‹</button>
      <h1 class="small" id="title">Book</h1>
      <button class="hb" id="bmAdd" title="Bookmark this spot">🔖</button>
      <button class="hb" id="bmList" title="Bookmarks">☰</button>
      <button class="hb" id="sleepBtn" title="Sleep timer">🌙</button>
    </header>
    <div id="reader"></div>
    <div id="player">
      <div class="prog"><button class="pgbtn" id="pgBtn">Page 1 ▾</button><div class="pbar"><i id="pbarI"></i></div></div>
      <div id="status"></div>
      <div class="row ctrls">
        <button class="ic" id="prevPg" title="Previous page">⏮</button>
        <button class="ic" id="prevS" title="Previous sentence">⏪</button>
        <button class="ic play" id="play">▶</button>
        <button class="ic" id="nextS" title="Next sentence">⏩</button>
        <button class="ic" id="nextPg" title="Next page">⏭</button>
      </div>
      <div class="chips" id="speeds"></div>
      <div class="seg"><button class="on" id="segNeural">Natural voices</button><button id="segDevice">Device voices</button></div>
      <div class="row"><select id="voice"></select><button class="btn" id="preview">Preview</button></div>
    </div>
  </div>
</div>

<div id="sheetBg"><div id="sheet"></div></div>
<div id="toast"></div>
<div id="load">Opening…</div>
<input type="file" id="file" accept="application/pdf,.pdf" hidden>

<script type="module">
const $=id=>document.getElementById(id);
const PDF_WORKER_URL='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
pdfjsLib.GlobalWorkerOptions.workerSrc=PDF_WORKER_URL;
let _pw=null;
function initPdfWorker(){return _pw||(_pw=fetch(PDF_WORKER_URL).then(r=>r.blob()).then(b=>{pdfjsLib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(b)}).catch(()=>{}))}
const synth=window.speechSynthesis;
const S={pdf:null,meta:null,page:1,sents:[],idx:0,playing:false,paused:false,rate:1,token:0,nav:0,cache:{},
  engine:'neural',neuralVoice:'af_heart',deviceVoice:null,tts:null,ctx:null,src:null,audio:new Map(),chain:Promise.resolve(),ocr:null,sleepAt:0};

function toast(m,ms=3200){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),ms)}
function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k));localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
const status=m=>$('status').textContent=m||'';
const ensureCtx=()=>{if(!S.ctx)S.ctx=new (window.AudioContext||window.webkitAudioContext)();return S.ctx};

/* ================= LIBRARY (IndexedDB) ================= */
let _db=null;
function db(){
  if(_db)return _db;
  _db=new Promise((res,rej)=>{
    try{const r=indexedDB.open('readaloud',1);
      r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('meta',{keyPath:'id'});d.createObjectStore('files',{keyPath:'id'})};
      r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}
  });return _db;
}
async function tx(store,mode,fn){const d=await db();return new Promise((res,rej)=>{const t=d.transaction(store,mode);const rq=fn(t.objectStore(store));t.oncomplete=()=>res(rq&&rq.result);t.onerror=()=>rej(t.error)})}
const metaAll=()=>tx('meta','readonly',s=>s.getAll());
const metaPut=m=>tx('meta','readwrite',s=>s.put(m));
const fileGet=id=>tx('files','readonly',s=>s.get(id));
const filePut=(id,blob)=>tx('files','readwrite',s=>s.put({id,blob}));
async function bookDel(id){const d=await db();return new Promise((res,rej)=>{const t=d.transaction(['meta','files'],'readwrite');t.objectStore('meta').delete(id);t.objectStore('files').delete(id);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}

async function renderLibrary(){
  let books=[];try{books=await metaAll()||[]}catch(e){}
  books.sort((a,b)=>(b.opened||0)-(a.opened||0));
  $('empty').style.display=books.length?'none':'flex';
  $('list').innerHTML='';
  books.forEach(b=>{
    const pct=b.pages?Math.round(100*(b.page||1)/b.pages):0;
    const el=document.createElement('div');el.className='book';
    el.innerHTML=`<div class="cover">${(b.name.trim()[0]||'P').toUpperCase()}</div>
      <div class="binfo"><div class="bt"></div><div class="bs">Page ${b.page||1} of ${b.pages||'?'} · ${pct}%</div><div class="bar"><i style="width:${pct}%"></i></div></div>
      <button class="del" title="Remove">🗑</button>`;
    el.querySelector('.bt').textContent=b.name;
    el.onclick=()=>openFromLibrary(b.id);
    el.querySelector('.del').onclick=async e=>{e.stopPropagation();if(confirm('Remove "'+b.name+'" from your library?')){await bookDel(b.id);renderLibrary()}};
    $('list').appendChild(el);
  });
}
function show(v){$('home').classList.toggle('on',v==='home');$('rd').classList.toggle('on',v==='rd')}

$('fab').onclick=()=>$('file').click();
$('file').onchange=e=>{const f=e.target.files[0];e.target.value='';f&&addFile(f)};

async function addFile(f){
  $('load').style.display='grid';
  try{
    const id=[f.name,f.size,f.lastModified].join('|');
    const name=f.name.replace(/\.pdf$/i,'');
    let meta=null;
    try{const all=await metaAll();meta=(all||[]).find(m=>m.id===id)}catch(e){}
    if(!meta)meta={id,name,pages:0,page:1,idx:0,bookmarks:[],added:Date.now()};
    await openBlob(f,meta,true);
  }catch(err){console.error(err);toast('Could not open this PDF: '+(err.message||err),5000)}
  $('load').style.display='none';
}
async function openFromLibrary(id){
  $('load').style.display='grid';
  try{
    const all=await metaAll();const meta=all.find(m=>m.id===id);const rec=await fileGet(id);
    if(!meta||!rec)throw new Error('File missing, please add it again');
    await openBlob(rec.blob,meta,false);
  }catch(err){console.error(err);toast(err.message||'Could not open',4000)}
  $('load').style.display='none';
}
async function openBlob(blob,meta,saveFile){
  stopAll();
  await initPdfWorker();
  const buf=await blob.arrayBuffer();
  S.pdf=await pdfjsLib.getDocument({data:buf}).promise;
  meta.pages=S.pdf.numPages;meta.opened=Date.now();meta.bookmarks=meta.bookmarks||[];
  S.meta=meta;S.cache={};S.audio.clear();
  try{await metaPut(meta);if(saveFile)await filePut(meta.id,blob)}catch(e){console.warn('Library unavailable',e);toast('Could not save to your library (private mode?)',4000)}
  $('title').textContent=meta.name;
  show('rd');
  await gotoPage(meta.page||1,meta.idx||0);
  if((meta.page||1)>1)toast('Resumed at page '+meta.page);
}
$('back').onclick=async()=>{stopAll();await saveMeta(true);S.pdf=null;S.meta=null;show('home');renderLibrary()};
let _sv=0;
function saveMeta(now){
  if(!S.meta)return Promise.resolve();
  S.meta.page=S.page;S.meta.idx=S.idx;
  clearTimeout(_sv);
  const go=()=>metaPut(S.meta).catch(()=>{});
  if(now)return go();
  _sv=setTimeout(go,800);return Promise.resolve();
}

/* ================= VOICES ================= */
const NEURAL_VOICES=[['af_heart','Heart · US woman'],['af_bella','Bella · US woman'],['af_nicole','Nicole · US woman (soft)'],['af_sarah','Sarah · US woman'],['am_michael','Michael · US man'],['am_fenrir','Fenrir · US man'],['am_puck','Puck · US man'],['bf_emma','Emma · UK woman'],['bf_isabella','Isabella · UK woman'],['bm_george','George · UK man'],['bm_fable','Fable · UK man']];
let deviceVoices=[];
function loadDeviceVoices(){
  const v=synth.getVoices();if(!v.length)return;
  const score=x=>(/siri|enhanced|premium|natural|neural/i.test(x.name)?-10:0)+(x.lang.startsWith('en')?-20:0);
  deviceVoices=[...v].sort((a,b)=>score(a)-score(b)||a.name.localeCompare(b.name));
  if(S.engine==='device')fillVoices();
}
if(synth){loadDeviceVoices();synth.onvoiceschanged=loadDeviceVoices}
function fillVoices(){
  const sel=$('voice');
  if(S.engine==='neural'){
    sel.innerHTML=NEURAL_VOICES.map(([id,l])=>`<option value="${id}">${l}</option>`).join('');sel.value=S.neuralVoice;
  }else{
    sel.innerHTML=deviceVoices.map(v=>`<option value="${v.voiceURI}">${v.name} (${v.lang})</option>`).join('');
    const saved=store('ra_dvoice');const pick=deviceVoices.find(v=>v.voiceURI===saved)||deviceVoices[0];
    if(pick){sel.value=pick.voiceURI;S.deviceVoice=pick}
  }
}
$('voice').onchange=e=>{
  if(S.engine==='neural'){S.neuralVoice=e.target.value;store('ra_nvoice',S.neuralVoice);S.audio.clear()}
  else{S.deviceVoice=deviceVoices.find(v=>v.voiceURI===e.target.value);store('ra_dvoice',e.target.value)}
  if(S.playing||S.paused)restart();
};
function setEngine(e){
  const was=S.playing||S.paused;stopAll();S.engine=e;store('ra_engine',e);
  $('segNeural').classList.toggle('on',e==='neural');$('segDevice').classList.toggle('on',e==='device');
  fillVoices();status('');if(was&&S.pdf){S.playing=true;setPlayIcon();startPlayback()}
}
$('segNeural').onclick=()=>setEngine('neural');$('segDevice').onclick=()=>setEngine('device');
S.neuralVoice=store('ra_nvoice')||'af_heart';
if(store('ra_engine')==='device')setEngine('device');else fillVoices();

[0.8,1,1.2,1.5,1.8].forEach(r=>{const b=document.createElement('button');b.className='chip'+(r===1?' on':'');b.textContent=r+'×';
  b.onclick=()=>{S.rate=r;[...$('speeds').children].forEach(c=>c.classList.toggle('on',c===b));S.audio.clear();if(S.playing||S.paused)restart()};$('speeds').appendChild(b)});

/* ================= NEURAL ENGINE (Kokoro, in a background thread so the screen never freezes) ================= */
S.epoch=0;
const WORKER_SRC=`
let tts=null,cur=0,q=Promise.resolve();
async function handle(m){
  try{
    if(m.type==='load'){
      const {KokoroTTS}=await import('https://cdn.jsdelivr.net/npm/kokoro-js@1.2.1/+esm');
      tts=await KokoroTTS.from_pretrained('onnx-community/Kokoro-82M-v1.0-ONNX',{dtype:'q8',device:'wasm',progress_callback:p=>self.postMessage({type:'progress',p})});
      self.postMessage({type:'ready'});
    }else if(m.type==='gen'){
      if(m.epoch<cur){self.postMessage({type:'skip',id:m.id});return}
      const a=await tts.generate(m.text,{voice:m.voice,speed:m.speed});
      const arr=a.audio;self.postMessage({type:'audio',id:m.id,audio:arr,sr:a.sampling_rate},[arr.buffer]);
    }
  }catch(err){self.postMessage({type:'error',id:m.id,msg:String(err&&err.message||err)})}
}
self.onmessage=e=>{const m=e.data;if(m.type==='epoch'){cur=m.n;return}q=q.then(()=>handle(m))};
`;
let W=null,wLoad=null,nid=1;const pending=new Map();
function ensureModel(){
  if(wLoad)return wLoad;
  status('Downloading voice model (about 90 MB, first time only)…');
  wLoad=new Promise((res,rej)=>{
    try{W=new Worker(URL.createObjectURL(new Blob([WORKER_SRC],{type:'text/javascript'})),{type:'module'})}catch(e){rej(e);return}
    W.onmessage=e=>{
      const m=e.data;
      if(m.type==='progress'){const p=m.p;if(p&&p.status==='progress'&&typeof p.progress==='number')status('Downloading voice model… '+Math.round(p.progress)+'%')}
      else if(m.type==='ready'){status('');res()}
      else if(m.type==='audio'){const p=pending.get(m.id);pending.delete(m.id);p&&p.res({audio:m.audio,sampling_rate:m.sr})}
      else if(m.type==='skip'){const p=pending.get(m.id);pending.delete(m.id);p&&p.rej({skipped:true})}
      else if(m.type==='error'){if(m.id){const p=pending.get(m.id);pending.delete(m.id);p&&p.rej(new Error(m.msg))}else rej(new Error(m.msg))}
    };
    W.onerror=ev=>rej(new Error(ev.message||'Worker failed'));
    W.postMessage({type:'load'});
  }).catch(err=>{wLoad=null;if(W){W.terminate();W=null}throw err});
  return wLoad;
}
function genAudio(text){
  const key=S.neuralVoice+'|'+S.rate+'|'+text;
  if(!S.audio.has(key)){
    const id=nid++,voice=S.neuralVoice,speed=S.rate,epoch=S.epoch;
    const p=new Promise((res,rej)=>{pending.set(id,{res,rej});W.postMessage({type:'gen',id,text,voice,speed,epoch})});
    S.audio.set(key,p);
    p.catch(()=>{if(S.audio.get(key)===p)S.audio.delete(key)});
    if(S.audio.size>40)S.audio.delete(S.audio.keys().next().value);
  }
  return S.audio.get(key);
}
function trimSilence(raw){
  const a=raw.audio,sr=raw.sampling_rate,th=0.012;
  let s=0,e=a.length-1;
  while(s<e&&Math.abs(a[s])<th)s++;
  while(e>s&&Math.abs(a[e])<th)e--;
  s=Math.max(0,s-Math.floor(sr*0.03));e=Math.min(a.length,e+Math.floor(sr*0.09));   // keep a short natural breath
  return a.subarray(s,e);
}
function playBuffer(raw){
  return new Promise(res=>{
    const ctx=S.ctx,data=trimSilence(raw),buf=ctx.createBuffer(1,Math.max(1,data.length),raw.sampling_rate);
    buf.copyToChannel(data,0);
    const src=ctx.createBufferSource();src.buffer=buf;src.connect(ctx.destination);
    S.src=src;src.onended=()=>res();src.start();
  });
}
async function runNeural(my){
  try{await ensureModel()}catch(err){console.error(err);status('');toast('Could not load the natural voice (needs internet the first time). Switching to device voice.',6000);if(my===S.token)setEngine('device');return}
  while(my===S.token){
    if(!S.sents.length){if(!await nextPage(my))return;continue}
    const text=S.sents[S.idx];
    const buffering=setTimeout(()=>{if(my===S.token)status('Preparing audio…')},700);
    let raw;try{raw=await genAudio(text)}catch(e){clearTimeout(buffering);if(e&&e.skipped)continue;console.error(e);S.idx++;continue}
    clearTimeout(buffering);status('');
    if(my!==S.token)return;
    for(let k=1;k<=3;k++){const n=S.sents[S.idx+k];if(n)genAudio(n).catch(()=>{})}
    mark();saveMeta();
    await playBuffer(raw);
    if(my!==S.token)return;
    S.idx++;
    if(S.idx>=S.sents.length&&!await nextPage(my))return;
  }
}
async function nextPage(my){
  let skipped=0;
  while(S.pdf&&S.page<S.pdf.numPages){
    await gotoPage(S.page+1,0);if(my!==S.token)return false;
    if(S.sents.length){if(skipped)toast(skipped+' empty page(s) skipped');return true}
    skipped++;
  }
  S.playing=false;S.paused=false;setPlayIcon();toast('Finished 🎉');return false;
}

/* ================= DEVICE ENGINE ================= */
function speakDevice(my){
  if(!synth){toast('Speech is not supported here');return}
  if(!S.sents.length){nextPage(my).then(ok=>{if(ok&&my===S.token)speakDevice(my)});return}
  const u=new SpeechSynthesisUtterance(S.sents[S.idx]);
  if(S.deviceVoice){u.voice=S.deviceVoice;u.lang=S.deviceVoice.lang}u.rate=S.rate;
  u.onstart=()=>{if(my===S.token){mark();saveMeta()}};
  u.onend=async()=>{if(my!==S.token)return;S.idx++;if(S.idx>=S.sents.length){if(!await nextPage(my))return}speakDevice(my)};
  u.onerror=e=>{if(e.error!=='canceled'&&e.error!=='interrupted')toast('Speech error: '+e.error)};
  if(synth.speaking||synth.pending){synth.cancel();setTimeout(()=>{if(my===S.token){synth.resume();synth.speak(u)}},60)}
  else{synth.resume();synth.speak(u)}
}

/* ================= PLAYBACK CONTROL ================= */
function setPlayIcon(){$('play').textContent=S.playing?'⏸':'▶'}
function stopAudio(){try{if(S.src){S.src.onended=null;S.src.stop()}}catch(e){}S.src=null;if(synth)synth.cancel()}
function stopAll(){S.token++;stopAudio();S.playing=false;S.paused=false;if(S.ctx&&S.ctx.state==='suspended')S.ctx.resume();setPlayIcon();status('')}
function startPlayback(){
  S.token++;const my=S.token;stopAudio();S.paused=false;
  S.epoch++;if(W)W.postMessage({type:'epoch',n:S.epoch});
  if(S.ctx&&S.ctx.state==='suspended')S.ctx.resume();
  if(S.engine==='neural')runNeural(my);else speakDevice(my);
}
function restart(){S.playing=true;setPlayIcon();startPlayback()}
$('play').onclick=()=>{
  if(!S.pdf)return;
  ensureCtx();
  if(S.ctx.state==='suspended'&&!S.paused)S.ctx.resume();
  if(S.playing){
    if(S.engine==='neural'){S.ctx.suspend();S.paused=true;S.playing=false}else stopAll();
    setPlayIcon();return;
  }
  if(S.paused&&S.engine==='neural'){S.ctx.resume();S.paused=false;S.playing=true;setPlayIcon();return}
  S.playing=true;setPlayIcon();startPlayback();
};
$('nextS').onclick=()=>{if(S.idx<S.sents.length-1){S.idx++;mark();if(S.playing||S.paused)restart()}else jump(S.page+1)};
$('prevS').onclick=()=>{if(S.idx>0){S.idx--;mark();if(S.playing||S.paused)restart()}else jump(S.page-1)};
$('nextPg').onclick=()=>jump(S.page+1);$('prevPg').onclick=()=>jump(S.page-1);
async function jump(n,idx=0){const was=S.playing||S.paused;S.token++;stopAudio();await gotoPage(n,idx);if(was){S.playing=true;setPlayIcon();startPlayback()}}
$('preview').onclick=async()=>{
  ensureCtx().resume();
  stopAll();
  const t='Hi, this is how I sound when I read your document.';
  if(S.engine==='neural'){try{await ensureModel();status('Preparing audio…');const raw=await genAudio(t);status('');await playBuffer(raw)}catch(e){status('');toast('Could not load the natural voice')}}
  else{const u=new SpeechSynthesisUtterance(t);if(S.deviceVoice)u.voice=S.deviceVoice;u.rate=S.rate;synth.speak(u)}
};

/* ================= TEXT EXTRACTION + OCR ================= */
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('Could not load '+src));document.head.appendChild(s)})}
async function getOcr(){
  if(S.ocr)return S.ocr;
  if(!window.Tesseract)await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js');
  S.ocr=await Tesseract.createWorker('eng');return S.ocr;
}
async function ocrPage(pg){
  const vp=pg.getViewport({scale:2});
  const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;
  await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
  const w=await getOcr();const {data}=await w.recognize(c);
  c.width=c.height=0;return data.text||'';
}
function cleanLines(lines){
  lines=lines.map(l=>l.replace(/\s+/g,' ').trim()).filter(l=>l&&!/^\d{1,4}$/.test(l)&&!/^[-–—•·.\s]+$/.test(l));
  return lines.join('\n').replace(/(\w)-\n(?=[a-zß-ÿ])/g,'$1').replace(/\n/g,' ').replace(/\s+/g,' ').trim();
}
function pageText(n){
  const pdf=S.pdf,cache=S.cache;
  if(!cache[n]){
    cache[n]=(async()=>{
      const pg=await pdf.getPage(n);const tc=await pg.getTextContent();
      let lines=[],cur='',lastY=null;
      for(const it of tc.items){
        if(!('str' in it))continue;
        const y=it.transform?it.transform[5]:0;
        if(lastY!==null&&Math.abs(y-lastY)>2&&cur){lines.push(cur);cur=''}
        cur+=it.str;lastY=y;
        if(it.hasEOL){lines.push(cur);cur='';lastY=null}
      }
      if(cur)lines.push(cur);
      let t=cleanLines(lines);
      if(t.length<25){            // no text layer: scanned page, read it with OCR
        try{t=cleanLines((await ocrPage(pg)).split('\n'))}catch(e){console.warn('OCR failed',e);t=''}
      }
      return t;
    })();
  }
  return cache[n];
}
function splitSentences(t){
  if(!t)return[];
  const P='\u0001';
  t=t.replace(/\b(Mr|Mrs|Ms|Dr|Prof|Sr|Jr|St|vs|Fig|Figs|No|Vol|approx|Inc|Ltd|Co|cf)\./g,'$1'+P)
     .replace(/\b(?:e\.g|i\.e|a\.m|p\.m|U\.S|U\.K)\./gi,m=>m.replace(/\./g,P))
     .replace(/(\d)\.(?=\d)/g,'$1'+P)
     .replace(/\b([A-Z])\.(?=\s[A-Z])/g,'$1'+P);
  const raw=t.match(/[^.!?…]+(?:[.!?…]+["'”’)\]]*|$)\s*/g)||[t];
  const out=[];
  for(let s of raw){s=s.trim();if(!s)continue;
    while(s.length>240){let cut=s.lastIndexOf(', ',200);if(cut<60)cut=s.lastIndexOf(' ',200);if(cut<60)cut=200;out.push(s.slice(0,cut+1).trim());s=s.slice(cut+1).trim()}
    if(s)out.push(s)}
  const merged=[];
  for(const s of out){            // very short fragments sound choppy: glue them to the next sentence
    const prev=merged[merged.length-1];
    if(prev&&prev.length<22&&prev.length+s.length<240)merged[merged.length-1]=prev+' '+s;
    else merged.push(s);
  }
  return merged.map(s=>s.split(P).join('.')).filter(s=>/[\p{L}\p{N}]/u.test(s));
}

/* ================= READER VIEW ================= */
async function gotoPage(n,idx=0){
  const my=++S.nav;
  S.page=Math.min(Math.max(1,n),S.pdf.numPages);
  const page=S.page,r=$('reader');
  updPg();
  if(!S.cache[page]){r.innerHTML='<div class="pgnote">Reading page '+page+'…<br>Scanned pages take a few seconds the first time.</div>'}
  const t=await pageText(page);
  if(my!==S.nav)return;
  S.sents=splitSentences(t);S.idx=Math.min(idx,Math.max(0,S.sents.length-1));
  r.innerHTML='';
  if(!S.sents.length){
    r.innerHTML='<div class="pgnote">Page '+page+' has no readable text, so it will be skipped.</div>';
  }else{
    const p=document.createElement('p');
    S.sents.forEach((s,i)=>{const sp=document.createElement('span');sp.className='s';sp.textContent=s+' ';sp.dataset.i=i;
      sp.onclick=()=>{ensureCtx();S.idx=i;mark();S.playing=true;setPlayIcon();startPlayback()};p.appendChild(sp)});
    r.appendChild(p);
  }
  r.scrollTop=0;mark();saveMeta();
  if(S.playing&&page<S.pdf.numPages)pageText(page+1).catch(()=>{});   // get the next page ready (and OCR it) while listening
}
function mark(){document.querySelectorAll('.s').forEach(e=>e.classList.toggle('on',+e.dataset.i===S.idx));const e=document.querySelector('.s.on');if(e)e.scrollIntoView({block:'center',behavior:'smooth'})}

/* ================= PAGE NAVIGATION ================= */
function updPg(){
  if(!S.pdf)return;
  $('pgBtn').textContent='Page '+S.page+' of '+S.pdf.numPages+' ▾';
  $('pbarI').style.width=(100*S.page/S.pdf.numPages)+'%';
}
$('pgBtn').onclick=()=>{
  if(!S.pdf)return;const n=S.pdf.numPages;
  const box=document.createElement('div');
  box.innerHTML='<div class="row" style="margin-bottom:14px"><input id="pgIn" type="number" inputmode="numeric" min="1" max="'+n+'" placeholder="Go to page (1-'+n+')" style="flex:1;min-width:0;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:16px"><button class="btn pri" id="pgGo">Go</button></div><div class="opts" id="pgQ"></div>';
  const go=v=>{v=Math.min(n,Math.max(1,v));closeSheet();jump(v)};
  box.querySelector('#pgGo').onclick=()=>{const v=parseInt(box.querySelector('#pgIn').value);if(v>=1&&v<=n)go(v);else toast('Enter a page from 1 to '+n)};
  box.querySelector('#pgIn').onkeydown=e=>{if(e.key==='Enter')box.querySelector('#pgGo').click()};
  [['⏮ Start',()=>1],['−50',()=>S.page-50],['−10',()=>S.page-10],['+10',()=>S.page+10],['+50',()=>S.page+50],['End ⏭',()=>n]].forEach(([l,f])=>{
    const b=document.createElement('button');b.className='chip';b.style.padding='10px 14px';b.textContent=l;b.onclick=()=>go(f());box.querySelector('#pgQ').appendChild(b)});
  openSheet('Go to page',box);
};

/* ================= SHEETS: bookmarks + sleep timer ================= */
function openSheet(title,node){const s=$('sheet');s.innerHTML='<h3></h3>';s.firstChild.textContent=title;s.appendChild(node);$('sheetBg').style.display='flex'}
function closeSheet(){$('sheetBg').style.display='none'}
$('sheetBg').onclick=e=>{if(e.target.id==='sheetBg')closeSheet()};

$('bmAdd').onclick=()=>{
  if(!S.meta||!S.sents.length)return;
  S.meta.bookmarks.push({page:S.page,idx:S.idx,text:S.sents[S.idx].slice(0,90),at:Date.now()});
  saveMeta(true);toast('Bookmarked page '+S.page+' 🔖');
};
$('bmList').onclick=()=>{
  if(!S.meta)return;
  const box=document.createElement('div');
  const bms=S.meta.bookmarks;
  if(!bms.length)box.innerHTML='<div class="pgnote">No bookmarks yet.<br>Tap 🔖 to save the sentence you are on.</div>';
  bms.forEach((b,i)=>{
    const row=document.createElement('div');row.className='bm';
    row.innerHTML='<div class="t"><b>Page '+b.page+'</b><div></div></div><button class="del">✕</button>';
    row.querySelector('.t div').textContent=b.text;
    row.onclick=()=>{closeSheet();jump(b.page,b.idx)};
    row.querySelector('.del').onclick=e=>{e.stopPropagation();bms.splice(i,1);saveMeta(true);closeSheet();$('bmList').click()};
    box.appendChild(row);
  });
  openSheet('Bookmarks',box);
};
$('sleepBtn').onclick=()=>{
  const box=document.createElement('div'),o=document.createElement('div');o.className='opts';
  [['Off',0],['10 min',10],['20 min',20],['30 min',30],['45 min',45],['60 min',60]].forEach(([l,m])=>{
    const b=document.createElement('button');b.className='chip'+((m===0&&!S.sleepAt)?' on':'');b.textContent=l;b.style.padding='10px 16px';
    b.onclick=()=>{S.sleepAt=m?Date.now()+m*60000:0;closeSheet();updSleep();if(m)toast('Will stop in '+m+' min 🌙')};o.appendChild(b)});
  box.appendChild(o);openSheet('Sleep timer',box);
};
function updSleep(){
  const b=$('sleepBtn');
  if(!S.sleepAt){b.textContent='🌙';return}
  const left=S.sleepAt-Date.now();
  if(left<=0){S.sleepAt=0;b.textContent='🌙';stopAll();toast('Sleep timer finished. Good night 🌙',5000);return}
  b.textContent='🌙 '+Math.ceil(left/60000)+'m';
}
setInterval(updSleep,5000);

window.addEventListener('pagehide',()=>{if(synth)synth.cancel();saveMeta(true)});
renderLibrary();
</script>
