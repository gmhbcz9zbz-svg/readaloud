<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="iread">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b38a9">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<title>iread</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{--blue:#0b38a9;--blue2:#0a2f8f;--blueSoft:#e8eeff;--bg:#f4f6fc;--card:#fff;--ink:#0f1a3d;--mute:#6b7699;--line:#dfe5f5;--hl:#cddcff;--paper:#ffffff}
@media(prefers-color-scheme:dark){:root{--bg:#081233;--card:#0f1d4a;--ink:#eef2ff;--mute:#93a0c9;--line:#1d2c5e;--hl:#24418f;--blueSoft:#15255a;--paper:#0b163d}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Poppins,-apple-system,sans-serif;overscroll-behavior:none}
button,input,select{font-family:inherit}
svg{display:block}
#app{height:100dvh;max-width:720px;margin:0 auto;position:relative;overflow:hidden}
.view{display:none;flex-direction:column;height:100%}.view.on{display:flex}

/* ---------- library ---------- */
.hero{background:var(--blue);color:#fff;padding:calc(env(safe-area-inset-top) + 18px) 22px 26px;border-radius:0 0 28px 28px}
.hero .top{display:flex;align-items:center;justify-content:space-between}
.brand{font-weight:900;font-size:38px;letter-spacing:-1.5px;line-height:1}
.plus{width:46px;height:46px;border-radius:50%;border:none;background:#fff;color:var(--blue);display:grid;place-items:center;cursor:pointer}
.hero p{margin:10px 0 0;font-weight:500;opacity:.85;font-size:14px}
#libwrap{flex:1;overflow-y:auto;padding:22px 18px 120px}
.sec{font-weight:700;font-size:13px;letter-spacing:1.5px;text-transform:uppercase;color:var(--mute);margin:0 4px 12px}
.book{display:flex;gap:14px;align-items:center;background:var(--card);border-radius:20px;padding:14px;margin-bottom:12px;cursor:pointer;border:1px solid var(--line)}
.cover{width:52px;height:68px;border-radius:10px;background:var(--blue);color:#fff;display:grid;place-items:center;flex:none}
.binfo{flex:1;min-width:0}
.bt{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bs{color:var(--mute);font-size:12px;font-weight:500;margin:2px 0 8px}
.bar{height:6px;background:var(--blueSoft);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue);border-radius:3px}
.del{border:none;background:none;color:var(--mute);padding:8px;cursor:pointer}
#fab{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 22px);border:none;background:var(--blue);color:#fff;font-size:16px;font-weight:700;padding:16px 28px;border-radius:999px;box-shadow:0 10px 28px rgba(11,56,169,.4);cursor:pointer;display:flex;align-items:center;gap:8px;white-space:nowrap}
#empty{display:none;flex-direction:column;align-items:center;text-align:center;padding:40px 20px;gap:10px}
#empty img{width:120px;height:120px;border-radius:28px}
#empty h2{margin:8px 0 0;font-size:22px;font-weight:800}#empty p{margin:0;color:var(--mute);max-width:300px;line-height:1.5;font-size:14px}

/* ---------- reader ---------- */
.rhead{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;background:var(--bg)}
.rhead h1{flex:1;font-size:16px;font-weight:700;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.hb{border:none;background:var(--card);color:var(--blue);border-radius:14px;min-width:42px;height:42px;display:grid;place-items:center;cursor:pointer;border:1px solid var(--line);font-weight:700;font-size:12px;padding:0 8px}
@media(prefers-color-scheme:dark){.hb{color:#fff}}
#reader{flex:1;overflow-y:auto;padding:10px 24px 30px;font-size:19px;line-height:1.8;font-weight:400;background:var(--bg)}
.s{cursor:pointer;border-radius:6px;padding:2px 0;transition:background .15s}.s.on{background:var(--hl)}
.pgnote{font-size:14px;color:var(--mute);text-align:center;padding:40px 10px;line-height:1.6}
#player{background:var(--blue);color:#fff;border-radius:28px 28px 0 0;padding:16px 18px calc(env(safe-area-inset-bottom) + 14px)}
.row{display:flex;align-items:center;gap:10px}
.pgbtn{border:none;background:rgba(255,255,255,.16);color:#fff;font-weight:700;font-size:13px;padding:9px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
.pbar{flex:1;height:6px;background:rgba(255,255,255,.2);border-radius:3px;overflow:hidden}.pbar i{display:block;height:100%;background:#fff;width:0}
#status{font-size:12px;font-weight:500;text-align:center;min-height:18px;margin:8px 0 2px;opacity:.85}
.ctrls{justify-content:center;gap:16px;margin:2px 0 12px}
.ic{width:48px;height:48px;border-radius:50%;border:none;background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center;cursor:pointer}
.ic.play{width:68px;height:68px;background:#fff;color:var(--blue)}
.chips{display:flex;gap:6px;justify-content:center;margin-bottom:12px}
.chip{border:1.5px solid rgba(255,255,255,.35);background:none;color:#fff;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer}
.chip.on{background:#fff;color:var(--blue);border-color:#fff}
.seg{display:flex;background:rgba(0,0,0,.18);border-radius:14px;padding:3px;margin-bottom:10px}
.seg button{flex:1;border:none;background:none;color:rgba(255,255,255,.75);padding:8px;border-radius:11px;font-size:13px;font-weight:600;cursor:pointer}
.seg button.on{background:#fff;color:var(--blue)}
select{flex:1;min-width:0;padding:12px;border-radius:14px;border:none;background:rgba(255,255,255,.16);color:#fff;font-size:14px;font-weight:600}
select option{color:#000}
.btnw{border:none;background:#fff;color:var(--blue);border-radius:14px;padding:12px 16px;font-size:14px;font-weight:700;cursor:pointer}

/* ---------- sheet, toast, loader ---------- */
#sheetBg{display:none;position:fixed;inset:0;background:rgba(8,18,51,.5);z-index:20;align-items:flex-end;justify-content:center}
#sheet{background:var(--card);width:100%;max-width:720px;border-radius:26px 26px 0 0;padding:20px 18px calc(env(safe-area-inset-bottom) + 22px);max-height:75dvh;overflow-y:auto}
#sheet h3{margin:0 0 14px;font-size:18px;font-weight:800}
.bm{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.bm .t{flex:1;min-width:0}.bm .t b{font-size:12px;color:var(--blue)}.bm .t div{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.ochip{border:1.5px solid var(--line);background:none;color:var(--ink);border-radius:999px;padding:10px 15px;font-size:14px;font-weight:600;cursor:pointer}
.ochip.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.inp{flex:1;min-width:0;padding:13px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font-size:16px}
.bpri{border:none;background:var(--blue);color:#fff;border-radius:14px;padding:13px 18px;font-size:15px;font-weight:700;cursor:pointer}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 70px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s;max-width:88%;text-align:center;z-index:30}
#toast.show{opacity:.96}
#load{display:none;position:fixed;inset:0;background:rgba(8,18,51,.55);place-items:center;color:#fff;font-weight:700;z-index:40}
</style>
</head>
<body>
<div id="app">

  <div class="view on" id="home">
    <div class="hero">
      <div class="top"><div class="brand">iread</div><button class="plus" id="plusTop" aria-label="Add PDF"></button></div>
      <p>Your books, read aloud.</p>
    </div>
    <div id="libwrap">
      <div id="empty">
        <img src="icon-512.png" alt="">
        <h2>Your library is empty</h2>
        <p>Add a PDF (a book, a paper, even a scan) and it stays here with your progress.</p>
      </div>
      <div class="sec" id="secT" style="display:none">Library</div>
      <div id="list"></div>
    </div>
    <button id="fab"></button>
  </div>

  <div class="view" id="rd">
    <div class="rhead">
      <button class="hb" id="back" aria-label="Library"></button>
      <h1 id="title">Book</h1>
      <button class="hb" id="bmAdd" aria-label="Bookmark"></button>
      <button class="hb" id="bmList" aria-label="Bookmarks"></button>
      <button class="hb" id="sleepBtn" aria-label="Sleep timer"></button>
    </div>
    <div id="reader"></div>
    <div id="player">
      <div class="row"><button class="pgbtn" id="pgBtn">Page 1</button><div class="pbar"><i id="pbarI"></i></div></div>
      <div id="status"></div>
      <div class="row ctrls">
        <button class="ic" id="prevPg" aria-label="Previous page"></button>
        <button class="ic" id="prevS" aria-label="Back"></button>
        <button class="ic play" id="play" aria-label="Play"></button>
        <button class="ic" id="nextS" aria-label="Forward"></button>
        <button class="ic" id="nextPg" aria-label="Next page"></button>
      </div>
      <div class="chips" id="speeds"></div>
      <div class="seg"><button class="on" id="segNeural">Natural voices</button><button id="segDevice">Device voices</button></div>
      <div class="row"><select id="voice"></select><button class="btnw" id="preview">Preview</button></div>
    </div>
  </div>
</div>

<div id="sheetBg"><div id="sheet"></div></div>
<div id="toast"></div>
<div id="load">Opening…</div>
<input type="file" id="file" accept="application/pdf,.pdf" hidden>

<script type="module">
const $=id=>document.getElementById(id);
const sv=(d,fill)=>`<svg width="22" height="22" viewBox="0 0 24 24" fill="${fill?'currentColor':'none'}" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const I={
  plus:sv('<path d="M12 5v14M5 12h14"/>'),
  back:sv('<path d="M15 18l-6-6 6-6"/>'),
  bm:sv('<path d="M6 3h12v18l-6-4-6 4z"/>'),
  list:sv('<path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/>'),
  moon:sv('<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>'),
  play:'<svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>',
  pause:'<svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4.2" height="14" rx="1.4"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.4"/></svg>',
  rew:sv('<path d="M11 7l-6 5 6 5zM19 7l-6 5 6 5z"/>',1),
  fwd:sv('<path d="M13 7l6 5-6 5zM5 7l6 5-6 5z"/>',1),
  prevPg:sv('<path d="M6 6v12M18 6l-9 6 9 6z"/>',1),
  nextPg:sv('<path d="M18 6v12M6 6l9 6-9 6z"/>',1),
  trash:sv('<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>'),
  book:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6c-2-1.5-5-2-8-1.5V18c3-.5 6 0 8 1.5 2-1.5 5-2 8-1.5V4.5C17 4 14 4.5 12 6zM12 6v13.5"/></svg>'
};
$('plusTop').innerHTML=I.plus;$('fab').innerHTML=I.plus+'Add PDF';
$('back').innerHTML=I.back;$('bmAdd').innerHTML=I.bm;$('bmList').innerHTML=I.list;$('sleepBtn').innerHTML=I.moon;
$('prevPg').innerHTML=I.prevPg;$('prevS').innerHTML=I.rew;$('nextS').innerHTML=I.fwd;$('nextPg').innerHTML=I.nextPg;$('play').innerHTML=I.play;

const PDF_WORKER_URL='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
pdfjsLib.GlobalWorkerOptions.workerSrc=PDF_WORKER_URL;
let _pw=null;
function initPdfWorker(){return _pw||(_pw=fetch(PDF_WORKER_URL).then(r=>r.blob()).then(b=>{pdfjsLib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(b)}).catch(()=>{}))}
const synth=window.speechSynthesis;
const S={pdf:null,meta:null,page:1,sents:[],idx:0,playing:false,paused:false,rate:1,token:0,nav:0,epoch:0,cache:{},
  engine:'neural',neuralVoice:'af_heart',deviceVoice:null,ctx:null,src:null,audio:new Map(),ocr:null,sleepAt:0,device:null};

function toast(m,ms=3200){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),ms)}
function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k));localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
const status=m=>$('status').textContent=m||'';
const ensureCtx=()=>{if(!S.ctx)S.ctx=new (window.AudioContext||window.webkitAudioContext)();return S.ctx};

/* ================= LIBRARY (saved on the phone) ================= */
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
let _db=null;
function db(){
  if(_db)return _db;
  _db=new Promise((res,rej)=>{
    try{const r=indexedDB.open('readaloud',1);
      r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('meta',{keyPath:'id'});d.createObjectStore('files',{keyPath:'id'})};
      r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}
  });return _db;
}
async function tx(st,mode,fn){const d=await db();return new Promise((res,rej)=>{const t=d.transaction(st,mode);const rq=fn(t.objectStore(st));t.oncomplete=()=>res(rq&&rq.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})}
const metaAll=()=>tx('meta','readonly',s=>s.getAll());
const metaPut=m=>tx('meta','readwrite',s=>s.put(m));
const fileGet=id=>tx('files','readonly',s=>s.get(id));
const filePut=(id,data)=>tx('files','readwrite',s=>s.put({id,data}));   // raw bytes: iPhone Safari is unreliable at storing File objects
async function bookDel(id){const d=await db();return new Promise((res,rej)=>{const t=d.transaction(['meta','files'],'readwrite');t.objectStore('meta').delete(id);t.objectStore('files').delete(id);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}

async function renderLibrary(){
  let books=[];try{books=await metaAll()||[]}catch(e){}
  books.sort((a,b)=>(b.opened||0)-(a.opened||0));
  $('empty').style.display=books.length?'none':'flex';
  $('secT').style.display=books.length?'block':'none';
  $('list').innerHTML='';
  books.forEach(b=>{
    const pct=b.pages?Math.round(100*(b.page||1)/b.pages):0;
    const el=document.createElement('div');el.className='book';
    el.innerHTML=`<div class="cover">${I.book}</div><div class="binfo"><div class="bt"></div><div class="bs">Page ${b.page||1} of ${b.pages||'?'} · ${pct}%</div><div class="bar"><i style="width:${pct}%"></i></div></div><button class="del" aria-label="Remove">${I.trash}</button>`;
    el.querySelector('.bt').textContent=b.name;
    el.onclick=()=>openFromLibrary(b.id);
    el.querySelector('.del').onclick=e=>{e.stopPropagation();confirmRemove(b)};
    $('list').appendChild(el);
  });
}
function confirmRemove(b){
  const box=document.createElement('div');
  box.innerHTML='<p style="margin:0 0 16px;color:var(--mute)">It will be removed from this phone.</p><div class="row"><button class="ochip" id="cNo" style="flex:1">Cancel</button><button class="bpri" id="cYes" style="flex:1;background:#d93a3a">Remove</button></div>';
  box.querySelector('#cNo').onclick=closeSheet;
  box.querySelector('#cYes').onclick=async()=>{closeSheet();await bookDel(b.id);renderLibrary()};
  openSheet('Remove "'+b.name+'"?',box);
}
function show(v){$('home').classList.toggle('on',v==='home');$('rd').classList.toggle('on',v==='rd')}
$('fab').onclick=$('plusTop').onclick=()=>$('file').click();
$('file').onchange=e=>{const f=e.target.files[0];e.target.value='';f&&addFile(f)};

async function addFile(f){
  $('load').style.display='grid';
  try{
    const id=[f.name,f.size].join('|');
    let meta=null;try{meta=(await metaAll()||[]).find(m=>m.id===id)}catch(e){}
    if(!meta)meta={id,name:f.name.replace(/\.pdf$/i,''),pages:0,page:1,idx:0,bookmarks:[],added:Date.now()};
    const data=await f.arrayBuffer();
    try{await filePut(id,data.slice(0))}catch(e){console.warn(e);toast('Could not save it to your library (storage full or private mode)',5000)}
    await openData(data,meta);
  }catch(err){console.error(err);toast('Could not open this PDF: '+(err.message||err),5000)}
  $('load').style.display='none';
}
async function openFromLibrary(id){
  $('load').style.display='grid';
  try{
    const meta=(await metaAll()).find(m=>m.id===id);const rec=await fileGet(id);
    if(!meta||!rec)throw new Error('This file is missing, please add it again');
    const data=rec.data||(rec.blob&&await rec.blob.arrayBuffer());
    if(!data)throw new Error('This file is missing, please add it again');
    await openData(data,meta);
  }catch(err){console.error(err);toast(err.message||'Could not open',4500)}
  $('load').style.display='none';
}
async function openData(data,meta){
  stopAll();await initPdfWorker();
  S.pdf=await pdfjsLib.getDocument({data}).promise;
  meta.pages=S.pdf.numPages;meta.opened=Date.now();meta.bookmarks=meta.bookmarks||[];
  S.meta=meta;S.cache={};S.audio.clear();
  try{await metaPut(meta)}catch(e){}
  $('title').textContent=meta.name;
  show('rd');
  await gotoPage(meta.page||1,meta.idx||0);
  if((meta.page||1)>1)toast('Welcome back, page '+meta.page);
  if(S.engine==='neural')ensureModel().catch(()=>{});   // start warming up the voice right away
}
$('back').onclick=async()=>{stopAll();await saveMeta(true);S.pdf=null;S.meta=null;show('home');renderLibrary()};
let _sv=0;
function saveMeta(now){
  if(!S.meta)return Promise.resolve();
  S.meta.page=S.page;S.meta.idx=S.idx;clearTimeout(_sv);
  const go=()=>metaPut(S.meta).catch(()=>{});
  if(now)return go();_sv=setTimeout(go,800);return Promise.resolve();
}

/* ================= VOICES ================= */
const NEURAL_VOICES=[['af_heart','Heart · US woman'],['af_bella','Bella · US woman'],['af_nicole','Nicole · US woman (soft)'],['af_sarah','Sarah · US woman'],['am_michael','Michael · US man'],['am_fenrir','Fenrir · US man'],['am_puck','Puck · US man'],['bf_emma','Emma · UK woman'],['bf_isabella','Isabella · UK woman'],['bm_george','George · UK man'],['bm_fable','Fable · UK man']];
let deviceVoices=[];
function loadDeviceVoices(){
  const v=synth.getVoices();if(!v.length)return;
  const score=x=>(/siri|enhanced|premium|natural|neural/i.test(x.name)?-10:0)+(x.lang.startsWith('en')?-20:0);
  deviceVoices=[...v].sort((a,b)=>score(a)-score(b)||a.name.localeCompare(b.name));
  if(S.engine==='device')fillVoices();
}
if(synth){loadDeviceVoices();synth.onvoiceschanged=loadDeviceVoices}
function fillVoices(){
  const sel=$('voice');
  if(S.engine==='neural'){sel.innerHTML=NEURAL_VOICES.map(([id,l])=>`<option value="${id}">${l}</option>`).join('');sel.value=S.neuralVoice}
  else{
    sel.innerHTML=deviceVoices.map(v=>`<option value="${v.voiceURI}">${v.name} (${v.lang})</option>`).join('');
    const saved=store('ra_dvoice');const pick=deviceVoices.find(v=>v.voiceURI===saved)||deviceVoices[0];
    if(pick){sel.value=pick.voiceURI;S.deviceVoice=pick}
  }
}
$('voice').onchange=e=>{
  if(S.engine==='neural'){S.neuralVoice=e.target.value;store('ra_nvoice',S.neuralVoice);S.audio.clear()}
  else{S.deviceVoice=deviceVoices.find(v=>v.voiceURI===e.target.value);store('ra_dvoice',e.target.value)}
  if(S.playing||S.paused)restart();
};
function setEngine(e){
  const was=S.playing||S.paused;stopAll();S.engine=e;store('ra_engine',e);
  $('segNeural').classList.toggle('on',e==='neural');$('segDevice').classList.toggle('on',e==='device');
  fillVoices();status('');if(was&&S.pdf){S.playing=true;setPlayIcon();startPlayback()}
}
$('segNeural').onclick=()=>setEngine('neural');$('segDevice').onclick=()=>setEngine('device');
S.neuralVoice=store('ra_nvoice')||'af_heart';
if(store('ra_engine')==='device')setEngine('device');else fillVoices();
[0.8,1,1.2,1.5,1.8].forEach(r=>{const b=document.createElement('button');b.className='chip'+(r===1?' on':'');b.textContent=r+'×';
  b.onclick=()=>{S.rate=r;[...$('speeds').children].forEach(c=>c.classList.toggle('on',c===b));S.audio.clear();if(S.playing||S.paused)restart()};$('speeds').appendChild(b)});

/* ================= NATURAL VOICE ENGINE (background thread) ================= */
const WORKER_SRC=`
let tts=null,cur=0,q=Promise.resolve();
async function handle(m){
  try{
    if(m.type==='load'){
      const {KokoroTTS}=await import('https://cdn.jsdelivr.net/npm/kokoro-js@1.2.1/+esm');
      const MODEL='onnx-community/Kokoro-82M-v1.0-ONNX',prog=p=>self.postMessage({type:'progress',p});
      let dev='wasm';
      try{
        if(m.gpu&&self.navigator&&navigator.gpu&&await navigator.gpu.requestAdapter()){
          self.postMessage({type:'note',text:'Setting up fast mode (first time only)…'});
          tts=await KokoroTTS.from_pretrained(MODEL,{dtype:'fp32',device:'webgpu',progress_callback:prog});
          await tts.generate('Ready.',{voice:'af_heart'});
          dev='webgpu';
        }
      }catch(err){tts=null}
      if(!tts){
        self.postMessage({type:'note',text:'Downloading voice (first time only)…'});
        tts=await KokoroTTS.from_pretrained(MODEL,{dtype:'q8',device:'wasm',progress_callback:prog});
        await tts.generate('Ready.',{voice:'af_heart'});
      }
      self.postMessage({type:'ready',device:dev});
    }else if(m.type==='gen'){
      if(m.epoch<cur){self.postMessage({type:'skip',id:m.id});return}
      const a=await tts.generate(m.text,{voice:m.voice,speed:m.speed});
      const arr=a.audio;self.postMessage({type:'audio',id:m.id,audio:arr,sr:a.sampling_rate},[arr.buffer]);
    }
  }catch(err){self.postMessage({type:'error',id:m.id,msg:String(err&&err.message||err)})}
}
self.onmessage=e=>{const m=e.data;if(m.type==='epoch'){cur=m.n;return}q=q.then(()=>handle(m))};
`;
let W=null,wLoad=null,nid=1;const pending=new Map();
function loadWorker(gpu){
  return new Promise((res,rej)=>{
    try{W=new Worker(URL.createObjectURL(new Blob([WORKER_SRC],{type:'text/javascript'})),{type:'module'})}catch(e){rej(e);return}
    let beat=Date.now(),phase=gpu?'gpu':'cpu';
    const watch=setInterval(()=>{                       // fast mode stuck for 25 s with no progress: give up on it
      if(phase==='gpu'&&Date.now()-beat>25000){clearInterval(watch);rej({stall:true})}
    },2000);
    W.onmessage=e=>{
      const m=e.data;
      if(m.type==='note'){beat=Date.now();phase=/fast/i.test(m.text)?'gpu':'cpu';S.loadNote=m.text;status(m.text)}
      else if(m.type==='progress'){beat=Date.now();const p=m.p;if(p&&p.status==='progress'&&typeof p.progress==='number'&&p.progress<100)status((S.loadNote||'Loading voice')+' '+Math.round(p.progress)+'%')}
      else if(m.type==='ready'){clearInterval(watch);S.device=m.device;$('segNeural').textContent='Natural voices'+(m.device==='webgpu'?' ⚡':'');status('');res()}
      else if(m.type==='audio'){const p=pending.get(m.id);pending.delete(m.id);p&&p.res({audio:m.audio,sampling_rate:m.sr})}
      else if(m.type==='skip'){const p=pending.get(m.id);pending.delete(m.id);p&&p.rej({skipped:true})}
      else if(m.type==='error'){if(m.id){const p=pending.get(m.id);pending.delete(m.id);p&&p.rej(new Error(m.msg))}else{clearInterval(watch);rej(new Error(m.msg))}}
    };
    W.onerror=ev=>{clearInterval(watch);rej(new Error(ev.message||'Worker failed'))};
    W.postMessage({type:'load',gpu});
  });
}
function ensureModel(){
  if(wLoad)return wLoad;
  const gpu=!store('ra_nogpu');
  wLoad=loadWorker(gpu).catch(err=>{
    if(W){W.terminate();W=null}
    if(gpu&&err&&err.stall){                                 // remember: this phone can't do fast mode, use standard mode from now on
      store('ra_nogpu',1);S.loadNote=null;toast('Fast mode is not working on this phone, using standard mode',4500);
      return loadWorker(false);
    }
    throw err;
  }).catch(err=>{wLoad=null;if(W){W.terminate();W=null}throw err});
  return wLoad;
}
function genAudio(text){
  const key=S.neuralVoice+'|'+S.rate+'|'+text;
  if(!S.audio.has(key)){
    const id=nid++,voice=S.neuralVoice,speed=S.rate,epoch=S.epoch;
    const p=new Promise((res,rej)=>{pending.set(id,{res,rej});W.postMessage({type:'gen',id,text,voice,speed,epoch})});
    S.audio.set(key,p);
    p.catch(()=>{if(S.audio.get(key)===p)S.audio.delete(key)});
    if(S.audio.size>30)S.audio.delete(S.audio.keys().next().value);
  }
  return S.audio.get(key);
}
function trimSilence(raw){
  const a=raw.audio,sr=raw.sampling_rate,th=0.012;
  let s=0,e=a.length-1;
  while(s<e&&Math.abs(a[s])<th)s++;
  while(e>s&&Math.abs(a[e])<th)e--;
  s=Math.max(0,s-Math.floor(sr*0.02));e=Math.min(a.length,e+Math.floor(sr*0.08));
  return a.subarray(s,e);
}
function playBuffer(raw){
  return new Promise(res=>{
    const ctx=S.ctx,data=trimSilence(raw),buf=ctx.createBuffer(1,Math.max(1,data.length),raw.sampling_rate);
    buf.copyToChannel(data,0);
    const src=ctx.createBufferSource();src.buffer=buf;src.connect(ctx.destination);
    S.src=src;src.onended=()=>res();src.start();
  });
}
/* the first bit of speech is kept short so it starts within seconds */
function quickHead(t){
  if(t.length<=60)return null;
  let cut=-1;const m=t.slice(18,60).search(/[,;:—–]\s/);if(m>=0)cut=18+m+1;
  if(cut<0){cut=t.lastIndexOf(' ',45);if(cut<15)return null}
  return [t.slice(0,cut).trim(),t.slice(cut).trim()];
}
async function runNeural(my){
  if(!wLoad||!S.device)status(S.loadNote||'Getting the voice ready…');
  try{await ensureModel()}catch(err){console.error(err);status('');toast('Could not load the natural voice (needs internet the first time). Switching to device voice.',6000);if(my===S.token)setEngine('device');return}
  let first=true;
  while(my===S.token){
    if(!S.sents.length){if(!await nextPage(my))return;continue}
    const text=S.sents[S.idx];
    const parts=first?(quickHead(text)||[text]):[text];first=false;
    const proms=parts.map(p=>genAudio(p));
    for(let k=1;k<=3;k++){const n=S.sents[S.idx+k];if(n)genAudio(n).catch(()=>{})}
    mark();saveMeta();
    let ok=true;
    for(const pr of proms){
      const buffering=setTimeout(()=>{if(my===S.token)status('Preparing audio…')},600);
      let raw;try{raw=await pr}catch(e){ok=!(e&&e.skipped);clearTimeout(buffering);if(!ok)break;console.error(e);break}
      clearTimeout(buffering);status('');
      if(my!==S.token)return;
      await playBuffer(raw);
      if(my!==S.token)return;
    }
    if(!ok)continue;
    S.idx++;
    if(S.idx>=S.sents.length&&!await nextPage(my))return;
  }
}
async function nextPage(my){
  let skipped=0;
  while(S.pdf&&S.page<S.pdf.numPages){
    await gotoPage(S.page+1,0);if(my!==S.token)return false;
    if(S.sents.length){if(skipped)toast(skipped+' empty page(s) skipped');return true}
    skipped++;
  }
  S.playing=false;S.paused=false;setPlayIcon();toast('Finished 🎉');return false;
}

/* ================= DEVICE VOICE ENGINE ================= */
function speakDevice(my){
  if(!synth){toast('Speech is not supported here');return}
  if(!S.sents.length){nextPage(my).then(ok=>{if(ok&&my===S.token)speakDevice(my)});return}
  const u=new SpeechSynthesisUtterance(S.sents[S.idx]);
  if(S.deviceVoice){u.voice=S.deviceVoice;u.lang=S.deviceVoice.lang}u.rate=S.rate;
  u.onstart=()=>{if(my===S.token){mark();saveMeta()}};
  u.onend=async()=>{if(my!==S.token)return;S.idx++;if(S.idx>=S.sents.length){if(!await nextPage(my))return}speakDevice(my)};
  u.onerror=e=>{if(e.error!=='canceled'&&e.error!=='interrupted')toast('Speech error: '+e.error)};
  if(synth.speaking||synth.pending){synth.cancel();setTimeout(()=>{if(my===S.token){synth.resume();synth.speak(u)}},60)}
  else{synth.resume();synth.speak(u)}
}

/* ================= PLAYBACK CONTROL ================= */
function setPlayIcon(){$('play').innerHTML=S.playing?I.pause:I.play}
function stopAudio(){try{if(S.src){S.src.onended=null;S.src.stop()}}catch(e){}S.src=null;if(synth)synth.cancel()}
function stopAll(){S.token++;stopAudio();S.playing=false;S.paused=false;if(S.ctx&&S.ctx.state==='suspended')S.ctx.resume();setPlayIcon();status('')}
function startPlayback(){
  S.token++;const my=S.token;stopAudio();S.paused=false;
  S.epoch++;if(W)W.postMessage({type:'epoch',n:S.epoch});
  if(S.ctx&&S.ctx.state==='suspended')S.ctx.resume();
  if(S.engine==='neural')runNeural(my);else speakDevice(my);
}
function restart(){S.playing=true;setPlayIcon();startPlayback()}
$('play').onclick=()=>{
  if(!S.pdf)return;ensureCtx();
  if(S.ctx.state==='suspended'&&!S.paused)S.ctx.resume();
  if(S.playing){if(S.engine==='neural'){S.ctx.suspend();S.paused=true;S.playing=false}else stopAll();setPlayIcon();return}
  if(S.paused&&S.engine==='neural'){S.ctx.resume();S.paused=false;S.playing=true;setPlayIcon();return}
  S.playing=true;setPlayIcon();startPlayback();
};
$('nextS').onclick=()=>{if(S.idx<S.sents.length-1){S.idx++;mark();if(S.playing||S.paused)restart()}else jump(S.page+1)};
$('prevS').onclick=()=>{if(S.idx>0){S.idx--;mark();if(S.playing||S.paused)restart()}else jump(S.page-1)};
$('nextPg').onclick=()=>jump(S.page+1);$('prevPg').onclick=()=>jump(S.page-1);
async function jump(n,idx=0){const was=S.playing||S.paused;S.token++;stopAudio();await gotoPage(n,idx);if(was){S.playing=true;setPlayIcon();startPlayback()}}
$('preview').onclick=async()=>{
  ensureCtx().resume();stopAll();
  const t='Hi, this is how I sound when I read to you.';
  if(S.engine==='neural'){try{status(S.loadNote||'Getting the voice ready…');await ensureModel();status('Preparing audio…');const raw=await genAudio(t);status('');await playBuffer(raw)}catch(e){status('');toast('Could not load the natural voice')}}
  else{const u=new SpeechSynthesisUtterance(t);if(S.deviceVoice)u.voice=S.deviceVoice;u.rate=S.rate;synth.speak(u)}
};

/* ================= TEXT + OCR ================= */
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('Could not load '+src));document.head.appendChild(s)})}
async function getOcr(){
  if(S.ocr)return S.ocr;
  if(!window.Tesseract)await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js');
  S.ocr=await Tesseract.createWorker('eng');return S.ocr;
}
async function ocrPage(pg){
  const vp=pg.getViewport({scale:2});
  const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;
  await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
  const w=await getOcr();const {data}=await w.recognize(c);
  c.width=c.height=0;return data.text||'';
}
function cleanLines(lines){
  lines=lines.map(l=>l.replace(/\s+/g,' ').trim()).filter(l=>l&&!/^\d{1,4}$/.test(l)&&!/^[-–—•·.\s]+$/.test(l));
  return lines.join('\n').replace(/(\w)-\n(?=[a-zß-ÿ])/g,'$1').replace(/\n/g,' ').replace(/\s+/g,' ').trim();
}
function pageText(n){
  const pdf=S.pdf,cache=S.cache;
  if(!cache[n]){
    cache[n]=(async()=>{
      const pg=await pdf.getPage(n);const tc=await pg.getTextContent();
      let lines=[],cur='',lastY=null;
      for(const it of tc.items){
        if(!('str' in it))continue;
        const y=it.transform?it.transform[5]:0;
        if(lastY!==null&&Math.abs(y-lastY)>2&&cur){lines.push(cur);cur=''}
        cur+=it.str;lastY=y;
        if(it.hasEOL){lines.push(cur);cur='';lastY=null}
      }
      if(cur)lines.push(cur);
      let t=cleanLines(lines);
      if(t.length<25){try{t=cleanLines((await ocrPage(pg)).split('\n'))}catch(e){console.warn('OCR failed',e);t=''}}
      return t;
    })();
  }
  return cache[n];
}
/* short pieces (one sentence or clause, max ~130 characters) so each one is ready quickly */
function splitSentences(t){
  if(!t)return[];
  const P='\u0001';
  t=t.replace(/\b(Mr|Mrs|Ms|Dr|Prof|Sr|Jr|St|vs|Fig|Figs|No|Vol|approx|Inc|Ltd|Co|cf)\./g,'$1'+P)
     .replace(/\b(?:e\.g|i\.e|a\.m|p\.m|U\.S|U\.K)\./gi,m=>m.replace(/\./g,P))
     .replace(/(\d)\.(?=\d)/g,'$1'+P)
     .replace(/\b([A-Z])\.(?=\s[A-Z])/g,'$1'+P);
  const raw=t.match(/[^.!?…]+(?:[.!?…]+["'”’)\]]*|$)\s*/g)||[t];
  const MAX=130,out=[];
  for(let s of raw){s=s.trim();if(!s)continue;
    while(s.length>MAX){
      let cut=-1;for(const re of [/[;:—–]\s/g,/,\s/g]){let m;re.lastIndex=0;while((m=re.exec(s))&&m.index<MAX)if(m.index>40)cut=m.index+1;if(cut>0)break}
      if(cut<0){cut=s.lastIndexOf(' ',MAX-10);if(cut<40)cut=MAX}
      out.push(s.slice(0,cut).trim());s=s.slice(cut).trim();
    }
    if(s)out.push(s)}
  const merged=[];
  for(const s of out){const prev=merged[merged.length-1];
    if(prev&&prev.length<22&&prev.length+s.length<MAX)merged[merged.length-1]=prev+' '+s;else merged.push(s)}
  return merged.map(s=>s.split(P).join('.')).filter(s=>/[\p{L}\p{N}]/u.test(s));
}

/* ================= READER VIEW ================= */
async function gotoPage(n,idx=0){
  const my=++S.nav;
  S.page=Math.min(Math.max(1,n),S.pdf.numPages);
  const page=S.page,r=$('reader');updPg();
  if(!S.cache[page])r.innerHTML='<div class="pgnote">Reading page '+page+'…<br>Scanned pages take a few seconds the first time.</div>';
  const t=await pageText(page);
  if(my!==S.nav)return;
  S.sents=splitSentences(t);S.idx=Math.min(idx,Math.max(0,S.sents.length-1));
  r.innerHTML='';
  if(!S.sents.length)r.innerHTML='<div class="pgnote">Page '+page+' has no readable text, so it will be skipped.</div>';
  else{
    const p=document.createElement('p');p.style.margin='0';
    S.sents.forEach((s,i)=>{const sp=document.createElement('span');sp.className='s';sp.textContent=s+' ';sp.dataset.i=i;
      sp.onclick=()=>{ensureCtx();S.idx=i;mark();S.playing=true;setPlayIcon();startPlayback()};p.appendChild(sp)});
    r.appendChild(p);
  }
  r.scrollTop=0;mark();saveMeta();
  if(page<S.pdf.numPages)pageText(page+1).catch(()=>{});
}
function mark(){document.querySelectorAll('.s').forEach(e=>e.classList.toggle('on',+e.dataset.i===S.idx));const e=document.querySelector('.s.on');if(e)e.scrollIntoView({block:'center',behavior:'smooth'})}
function updPg(){if(!S.pdf)return;$('pgBtn').textContent='Page '+S.page+' of '+S.pdf.numPages;$('pbarI').style.width=(100*S.page/S.pdf.numPages)+'%'}

/* ================= SHEETS ================= */
function openSheet(title,node){const s=$('sheet');s.innerHTML='<h3></h3>';s.firstChild.textContent=title;s.appendChild(node);$('sheetBg').style.display='flex'}
function closeSheet(){$('sheetBg').style.display='none'}
$('sheetBg').onclick=e=>{if(e.target.id==='sheetBg')closeSheet()};
$('pgBtn').onclick=()=>{
  if(!S.pdf)return;const n=S.pdf.numPages;
  const box=document.createElement('div');
  box.innerHTML='<div class="row" style="margin-bottom:14px"><input class="inp" id="pgIn" type="number" inputmode="numeric" min="1" max="'+n+'" placeholder="Page number (1–'+n+')"><button class="bpri" id="pgGo">Go</button></div><div class="opts" id="pgQ"></div>';
  const go=v=>{v=Math.min(n,Math.max(1,v));closeSheet();jump(v)};
  box.querySelector('#pgGo').onclick=()=>{const v=parseInt(box.querySelector('#pgIn').value);if(v>=1&&v<=n)go(v);else toast('Enter a page from 1 to '+n)};
  box.querySelector('#pgIn').onkeydown=e=>{if(e.key==='Enter')box.querySelector('#pgGo').click()};
  [['Start',()=>1],['−50',()=>S.page-50],['−10',()=>S.page-10],['+10',()=>S.page+10],['+50',()=>S.page+50],['End',()=>n]].forEach(([l,f])=>{
    const b=document.createElement('button');b.className='ochip';b.textContent=l;b.onclick=()=>go(f());box.querySelector('#pgQ').appendChild(b)});
  openSheet('Go to page',box);
};
$('bmAdd').onclick=()=>{
  if(!S.meta||!S.sents.length)return;
  S.meta.bookmarks.push({page:S.page,idx:S.idx,text:S.sents[S.idx].slice(0,90),at:Date.now()});
  saveMeta(true);toast('Bookmarked page '+S.page);
};
$('bmList').onclick=()=>{
  if(!S.meta)return;
  const box=document.createElement('div'),bms=S.meta.bookmarks;
  if(!bms.length)box.innerHTML='<div class="pgnote" style="padding:16px">No bookmarks yet. Tap the bookmark icon to save the line you are on.</div>';
  bms.forEach((b,i)=>{
    const row=document.createElement('div');row.className='bm';
    row.innerHTML='<div class="t"><b>Page '+b.page+'</b><div></div></div><button class="del">'+I.trash+'</button>';
    row.querySelector('.t div').textContent=b.text;
    row.onclick=()=>{closeSheet();jump(b.page,b.idx)};
    row.querySelector('.del').onclick=e=>{e.stopPropagation();bms.splice(i,1);saveMeta(true);closeSheet();$('bmList').click()};
    box.appendChild(row);
  });
  openSheet('Bookmarks',box);
};
$('sleepBtn').onclick=()=>{
  const box=document.createElement('div'),o=document.createElement('div');o.className='opts';
  [['Off',0],['10 min',10],['20 min',20],['30 min',30],['45 min',45],['60 min',60]].forEach(([l,m])=>{
    const b=document.createElement('button');b.className='ochip'+((m===0&&!S.sleepAt)?' on':'');b.textContent=l;
    b.onclick=()=>{S.sleepAt=m?Date.now()+m*60000:0;closeSheet();updSleep();if(m)toast('Stopping in '+m+' min')};o.appendChild(b)});
  box.appendChild(o);openSheet('Sleep timer',box);
};
function updSleep(){
  const b=$('sleepBtn');
  if(!S.sleepAt){b.innerHTML=I.moon;return}
  const left=S.sleepAt-Date.now();
  if(left<=0){S.sleepAt=0;b.innerHTML=I.moon;stopAll();toast('Sleep timer finished. Good night',5000);return}
  b.textContent=Math.ceil(left/60000)+'m';
}
setInterval(updSleep,5000);
window.addEventListener('pagehide',()=>{if(synth)synth.cancel();saveMeta(true)});
renderLibrary();
if(S.engine==='neural')setTimeout(()=>ensureModel().catch(()=>{}),1500);   // warm up the voice as soon as the app opens
</script>
